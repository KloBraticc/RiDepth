-size="12" font-weight="bold" fill="#e8e8e8">518 x 294 input</text><text x="242" y="283" text-anchor="end" font-size="11" fill="#e8e8e8">Depth Anything V2 Small (94.5 MB)</text><rect x="250" y="272" width="469.1" height="14" fill="#9a9fa6"/><text x="725.1" y="283" font-size="11" fill="#e8e8e8">411.48</text><text x="242" y="303" text-anchor="end" font-size="11" fill="#e8e8e8">RiDepth (13.9 MB)</text><rect x="250" y="292" width="131.5" height="14" fill="#c9a227"/><text x="387.5" y="303" font-size="11" fill="#e8e8e8">115.33 (3.6x)</text><text x="242" y="323" text-anchor="end" font-size="11" fill="#e8e8e8">RiDepth Tiny (3.7 MB)</text><rect x="250" y="312" width="17.6" height="14" fill="#5fb85f"/><text x="273.6" y="323" font-size="11" fill="#e8e8e8">15.42 (26.7x)</text><text x="24" y="382" font-size="10.5" fill="#b4b8bd">2026-10-26, a GitHub Actions Windows runner CPU, ONNX Runtime 1.31.0, full precision, median of 60 runs. Updated by the benchmark workflow.</text></svg>