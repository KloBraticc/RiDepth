<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396" role="img" aria-label="RiDepth pipeline and speed benchmark" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="396" fill="#3a3d42"/><text x="24" y="32" font-size="15" font-weight="bold" fill="#e8e8e8">RiDepth pipeline</text><rect x="24" y="46" width="166" height="48" fill="#45494f" stroke="#5c6168" stroke-width="1"/><text x="34" y="66" font-size="12" font-weight="bold" fill="#e8e8e8">Roblox Studio</text><text x="34" y="83" font-size="10.5" fill="#b4b8bd">rays give the true depth</text><rect x="212" y="46" width="166" height="48" fill="#45494f" stroke="#5c6168" stroke-width="1"/><text x="222" y="66" font-size="12" font-weight="bold" fill="#e8e8e8">capture_server.py</text><text x="222" y="83" font-size="10.5" fill="#b4b8bd">saves picture + depth</text><text x="201.0" y="75" text-anchor="middle" font-size="13" fill="#b4b8bd">&gt;</text><rect x="400" y="46" width="166" height="48" fill="#45494f" stroke="#5c6168" stroke-width="1"/><text x="410" y="66" font-size="12" font-weight="bold" fill="#e8e8e8">train.py</text><text x="410" y="83" font-size="10.5" fill="#b4b8bd">PyTorch, CUDA</text><text x="389.0" y="75" text-anchor="middle" font-size="13" fill="#b4b8bd">&gt;</text><rect x="588" y="46" width="166" height="48" fill="#45494f" stroke="#5c6168" stroke-width="1"/><text x="598" y="66" font-size="12" font-weight="bold" fill="#e8e8e8">export.py</text><text x="598" y="83" font-size="10.5" fill="#b4b8bd">Tiny ONNX, 3.7 MB</text><text x="577.0" y="75" text-anchor="middle" font-size="13" fill="#b4b8bd">&gt;</text><rect x="776" y="46" width="166" height="48" fill="#45494f" stroke="#5c6168" stroke-width="1"/><text x="786" y="66" font-size="12" font-weight="bold" fill="#e8e8e8">RiShade</text><text x="786" y="83" font-size="10.5" fill="#b4b8bd">DirectML, every frame</text><text x="765.0" y="75" text-anchor="middle" font-size="13" fill="#b4b8bd">&gt;</text><text x="2